# Supabase CLI configuration for LOCAL development (`supabase start`).
# Hosted-project settings (Auth redirect URLs, SMTP, etc.) are configured in
# the Supabase Dashboard — see docs/installation.md.
project_id = "smartlibrary-manager"

[api]
enabled = true
port = 54321
# Only "public" is exposed. Schema "private" (RLS helpers) must NEVER be added.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "my.smartlibrary.manager://auth-callback"
additional_redirect_urls = ["my.smartlibrary.manager://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[storage]
enabled = true
file_size_limit = "200MiB"
