name: CI

on:
  push:
  pull_request:

jobs:
  database:
    name: Migrations + RLS tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/db_test.sh

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Install system packages (libsqlite3-dev)
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 180 sudo apt-get update -o Acquire::Retries=3 \
              && timeout 180 sudo apt-get install -y --no-install-recommends libsqlite3-dev && exit 0
            echo "::warning::apt gagal/tersangkut (cubaan $i), cuba semula"; sleep 15
          done
          exit 1
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  sync-integration:
    name: Sync engine vs PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Install system packages (libsqlite3-dev postgresql-client)
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            timeout 180 sudo apt-get update -o Acquire::Retries=3 \
              && timeout 180 sudo apt-get install -y --no-install-recommends libsqlite3-dev postgresql-client && exit 0
            echo "::warning::apt gagal/tersangkut (cubaan $i), cuba semula"; sleep 15
          done
          exit 1
      - run: flutter pub get --enforce-lockfile
      - run: ./scripts/sync_integration_test.sh

  security-audit:
    name: Security audit (repo)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/security_audit.sh

  apk:
    name: Build APKs + audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Placeholder config: CI APKs are for build/audit only (no real project).
      - name: Build APKs (with retries for flaky Maven/Gradle downloads)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define-from-file=env/dev.example.json && exit 0
            echo "::warning::Build failed (attempt $i), retrying in 60s"; sleep 60
          done
          exit 1
      - run: ./scripts/security_audit.sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release-debug-signed
          path: build/app/outputs/flutter-apk/*-release.apk
